<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Forms</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!-- Netlify reads this at deploy to register the booking form; the site posts to it with fetch. -->
    <form name="booking" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" />
      <select name="service"><option>Reel</option><option>Photoshoot</option><option>Video</option><option>Something else</option></select>
      <input name="date" />
      <input name="location" />
      <input name="budget" />
      <textarea name="requirements"></textarea>
    </form>
  </body>
</html>
